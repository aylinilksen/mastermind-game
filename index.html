
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastermind Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">

    <h1>MASTERMIND</h1>
    <p class="subtitle">Guess the secret number!</p>

    <div class="settings" id="settings">
        <label for="digitCount">Number of digits:</label>

        <select id="digitCount">
            <option value="1">1 Digit</option>
            <option value="2">2 Digits</option>
            <option value="3">3 Digits</option>
            <option value="4" selected>4 Digits</option>
            <option value="5">5 Digits</option>
            <option value="6">6 Digits</option>
            <option value="7">7 Digits</option>
            <option value="8">8 Digits</option>
            <option value="9">9 Digits</option>
        </select>

        <button id="startButton">Start Game</button>
    </div>

    <div id="gameArea" hidden>

        <div class="info">
            <span>Attempts left:</span>
            <strong id="attemptsLeft">10</strong>
        </div>

        <div class="guess-input">
            <input
                    type="text"
                    id="guessInput"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="Enter your guess"
            >

            <button id="guessButton">GUESS</button>
        </div>

        <p id="message">Good luck!</p>

        <h3>Previous guesses</h3>
        <div id="history"></div>

        <button id="restartButton">New Game</button>

    </div>

</div>

<script src="app.js"></script>
<script src="game.js"></script>

</body>
</html>
